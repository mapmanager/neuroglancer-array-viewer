<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neuroglancer direct-JS Phase A</title>
  </head>
  <body>
    <main>
      <header><div><span>V2 · DIRECT-JS PHASE A</span><h1>Neuroglancer mounted in our div</h1></div><strong id="status">Starting…</strong></header>
      <section class="controls">
        <label>Layout <select id="layout"><option>xy</option><option>xy-3d</option><option>4panel</option><option>3d</option></select></label>
        <label><input id="scale-bar" type="checkbox" checked /> Scale bar</label>
        <label><input id="axis-lines" type="checkbox" /> Axis lines</label>
        <button id="reset">Reload public source</button>
      </section>
      <div id="ng-viewer" aria-label="Directly embedded Neuroglancer viewer"></div>
      <p>Known-supported HTTP source: Neuroglancer public FlyEM FIB-25 precomputed image. No iframe and no custom NumPy datasource.</p>
      <details open><summary>Adapter diagnostics</summary><pre id="diagnostics"></pre></details>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
