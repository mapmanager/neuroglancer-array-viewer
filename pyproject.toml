[project]
name = "neuroglancer-array-viewer"
version = "2.0.0"
description = "Standalone Neuroglancer GitHub-master integration experiments"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "neuroglancer @ git+https://github.com/google/neuroglancer@576c94b08ad7609919eb42f8a93b9cf0e161df14",
  "numpy>=2.1,<3",
]

[dependency-groups]
dev = [
  "acqstore; python_version >= '3.12'",
  "pytest>=9,<10",
]

[tool.uv]
package = true

[tool.uv.sources]
acqstore = { path = "../acqstore", editable = true }

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ng_viewer = ["static/**/*"]
