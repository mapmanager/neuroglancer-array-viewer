<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neuroglancer Array Viewer</title>
    <script type="module" crossorigin src="/assets/index-6n-JGuAV.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-D5m4GkoO.css">
  </head>
  <body class="ng-viewer-page">
    <main>
      <header id="viewer-header">
        <strong id="status">Starting…</strong>
      </header>
      <section class="controls" aria-label="Direct viewer controls">
        <label>Datasource
          <select id="datasource">
            <option value="public">Public FIB-25</option>
            <option value="numpy-a">NumPy · Dataset A · 70Z × 2C × 1024²</option>
            <option value="numpy-b">NumPy · Dataset B · 31Z × 1C × 512×768</option>
            <option value="numpy-c">NumPy · Dataset C · 18Z × 3C × 640×384</option>
            <option value="numpy-long-2c">AcqImage synthetic · 2C × 50000×1024</option>
            <option value="numpy-long-1c">AcqImage synthetic · 1C × 30000×100</option>
            <option value="numpy-rr30a">AcqStore sample · rr30a two-channel</option>
          </select>
        </label>
      </section>

      <section id="viewer-stage" class="viewer-stage placement-top viewer-initializing">
        <nav id="layout-chrome" class="layout-chrome" aria-label="Viewer layout">
          <span class="chrome-title">Layout</span>
          <button type="button" data-layout="xy">XY</button>
          <button type="button" data-layout="channels-row">Channels side-by-side</button>
          <button type="button" data-layout="channels-column">Channels stacked</button>
          <button type="button" data-layout="xy-3d">XY + 3D</button>
          <button type="button" data-layout="4panel-alt">4 panel</button>
          <button type="button" data-layout="3d">3D</button>
        </nav>
        <aside id="channel-chrome" class="channel-chrome" aria-label="Channel display controls">
          <button id="channel-toggle" class="channel-toggle" type="button" aria-expanded="true">Channels</button>
          <div id="channel-controls" class="channel-controls"></div>
        </aside>
        <div id="ng-viewer" aria-label="Directly embedded Neuroglancer viewer"></div>
        <aside id="z-chrome" class="z-chrome" aria-label="Z slice control" hidden>
          <span class="z-title">Z</span>
          <input id="z-slider" type="range" min="0" max="1" step="1" value="0" aria-label="Z slice" />
          <output id="z-readout" for="z-slider">0/1</output>
        </aside>
        <details id="options-chrome" class="options-chrome">
          <summary aria-label="Viewer options">Options</summary>
          <div class="options-menu" aria-label="Viewer options">
            <label><input id="option-scale-bar" type="checkbox" checked /> Scale bar</label>
            <label><input id="option-axis-lines" type="checkbox" /> Axis lines</label>
            <label><input id="option-display-dimensions" type="checkbox" checked /> Display dimensions</label>
            <label><input id="option-native-layout-buttons" type="checkbox" checked /> Native layout buttons</label>
            <label><input id="option-channel-controls" type="checkbox" checked /> Channels control</label>
            <label><input id="option-layout-controls" type="checkbox" checked /> Layout controls</label>
            <hr />
            <button id="option-fit-image" type="button">Fit image</button>
          </div>
        </details>
      </section>

      <details id="diagnostics-panel" open><summary>Viewer diagnostics</summary><pre id="diagnostics"></pre></details>
    </main>
  </body>
</html>
